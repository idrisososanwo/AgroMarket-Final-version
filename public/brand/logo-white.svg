<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none" role="img" aria-label="AgroMarket White Horizontal Logo">
  <!-- AgroMarket White Horizontal Logo (For dark or deep green surfaces) -->
  <g transform="translate(8, 4) scale(0.72)">
    <!-- Network Pathways -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M 22 82 L 28 50 L 50 18" stroke="#FFFFFF" stroke-width="7" />
      <path d="M 78 82 L 72 50 L 50 18" stroke="#FFFFFF" stroke-width="7" />
      <path d="M 28 50 L 72 50" stroke="#FFFFFF" stroke-width="6.5" opacity="0.8" />
      <path d="M 50 76 L 50 18" stroke="#22C55E" stroke-width="6" />
      <path d="M 22 82 L 50 76 L 78 82" stroke="#FFFFFF" stroke-width="5.5" opacity="0.7" />
    </g>

    <!-- Network Nodes -->
    <circle cx="22" cy="82" r="7" fill="#FFFFFF" />
    <circle cx="22" cy="82" r="2.8" fill="#0F4327" />
    <circle cx="78" cy="82" r="7" fill="#FFFFFF" />
    <circle cx="78" cy="82" r="2.8" fill="#0F4327" />
    <circle cx="50" cy="76" r="6" fill="#22C55E" />
    <circle cx="50" cy="76" r="2.4" fill="#0F4327" />
    <circle cx="28" cy="50" r="6.5" fill="#FFFFFF" />
    <circle cx="28" cy="50" r="2.5" fill="#0F4327" />
    <circle cx="72" cy="50" r="6.5" fill="#FFFFFF" />
    <circle cx="72" cy="50" r="2.5" fill="#0F4327" />
    <circle cx="50" cy="50" r="6" fill="#FDE047" />
    <circle cx="50" cy="50" r="2.4" fill="#0F4327" />
    <circle cx="50" cy="18" r="8" fill="#22C55E" />
    <circle cx="50" cy="18" r="3.2" fill="#0F4327" />
  </g>

  <!-- Wordmark Section -->
  <text x="96" y="48" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5px">
    <tspan fill="#FFFFFF">Agro</tspan><tspan fill="#86EFAC">Market</tspan>
  </text>
  <text x="98" y="66" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0" letter-spacing="2.2px" opacity="0.85">
    AGRICULTURAL NETWORK
  </text>
</svg>
