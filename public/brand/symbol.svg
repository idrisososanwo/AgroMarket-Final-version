<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="AgroMarket Agro Network Symbol">
  <!-- AgroMarket "Agro Network" Brand Mark -->
  <!-- Connected agricultural ecosystem nodes & pathways forming growth 'A' architecture -->

  <!-- Network Pathways / Connecting Infrastructure -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Ascent Conduit (Primary Deep Agricultural Green) -->
    <path d="M 22 82 L 28 50 L 50 18" stroke="#0F4327" stroke-width="7" />

    <!-- Right Ascent Conduit (Primary Deep Agricultural Green) -->
    <path d="M 78 82 L 72 50 L 50 18" stroke="#0F4327" stroke-width="7" />

    <!-- Horizontal Trade & Logistics Crossbar (Warm Earth Clay) -->
    <path d="M 28 50 L 72 50" stroke="#C26732" stroke-width="6.5" />

    <!-- Central Vertical Growth Stem (Fresh Growth Green) -->
    <path d="M 50 76 L 50 18" stroke="#16A34A" stroke-width="6" />

    <!-- Base Roots / Cluster Interconnections -->
    <path d="M 22 82 L 50 76 L 78 82" stroke="#0F4327" stroke-width="5.5" stroke-dasharray="0" opacity="0.85" />
  </g>

  <!-- Network Nodes / Ecosystem Stakeholders & Intelligence Points -->
  <!-- Base Left Node (Producers & Farmers) -->
  <circle cx="22" cy="82" r="7" fill="#0F4327" />
  <circle cx="22" cy="82" r="2.8" fill="#FBF9F4" />

  <!-- Base Right Node (Buyers & Commerce) -->
  <circle cx="78" cy="82" r="7" fill="#0F4327" />
  <circle cx="78" cy="82" r="2.8" fill="#FBF9F4" />

  <!-- Base Central Node (Agricultural Aggregation) -->
  <circle cx="50" cy="76" r="6" fill="#16A34A" />
  <circle cx="50" cy="76" r="2.4" fill="#FBF9F4" />

  <!-- Mid Left Node (Processing & Value Chains) -->
  <circle cx="28" cy="50" r="6.5" fill="#C26732" />
  <circle cx="28" cy="50" r="2.5" fill="#FBF9F4" />

  <!-- Mid Right Node (Markets & Logistics Corridors) -->
  <circle cx="72" cy="50" r="6.5" fill="#C26732" />
  <circle cx="72" cy="50" r="2.5" fill="#FBF9F4" />

  <!-- Center Hub Node (Ecosystem Coordination & Intelligence) -->
  <circle cx="50" cy="50" r="6" fill="#E59500" />
  <circle cx="50" cy="50" r="2.4" fill="#FBF9F4" />

  <!-- Apex Node (Growth Apex & Digital Infrastructure) -->
  <circle cx="50" cy="18" r="8" fill="#16A34A" />
  <circle cx="50" cy="18" r="3.2" fill="#FBF9F4" />
</svg>
