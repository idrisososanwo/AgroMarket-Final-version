<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="AgroMarket App Icon">
  <!-- Rounded Squircle Background Container -->
  <rect width="512" height="512" rx="115" fill="#0F4327" />

  <!-- Subtle Inner Ambient Border -->
  <rect x="6" y="6" width="500" height="500" rx="110" stroke="#16A34A" stroke-width="2.5" stroke-opacity="0.3" fill="none" />

  <!-- Scaled Agro Network Symbol Centered -->
  <g transform="translate(64, 64) scale(3.84)">
    <!-- Network Pathways -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M 22 82 L 28 50 L 50 18" stroke="#FFFFFF" stroke-width="6.5" />
      <path d="M 78 82 L 72 50 L 50 18" stroke="#FFFFFF" stroke-width="6.5" />
      <path d="M 28 50 L 72 50" stroke="#C26732" stroke-width="6" />
      <path d="M 50 76 L 50 18" stroke="#22C55E" stroke-width="6" />
      <path d="M 22 82 L 50 76 L 78 82" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.9" />
    </g>

    <!-- Network Nodes -->
    <circle cx="22" cy="82" r="7" fill="#FFFFFF" />
    <circle cx="22" cy="82" r="2.8" fill="#0F4327" />

    <circle cx="78" cy="82" r="7" fill="#FFFFFF" />
    <circle cx="78" cy="82" r="2.8" fill="#0F4327" />

    <circle cx="50" cy="76" r="6" fill="#22C55E" />
    <circle cx="50" cy="76" r="2.4" fill="#0F4327" />

    <circle cx="28" cy="50" r="6.5" fill="#C26732" />
    <circle cx="28" cy="50" r="2.5" fill="#0F4327" />

    <circle cx="72" cy="50" r="6.5" fill="#C26732" />
    <circle cx="72" cy="50" r="2.5" fill="#0F4327" />

    <circle cx="50" cy="50" r="6" fill="#E59500" />
    <circle cx="50" cy="50" r="2.4" fill="#0F4327" />

    <circle cx="50" cy="18" r="8" fill="#22C55E" />
    <circle cx="50" cy="18" r="3.2" fill="#0F4327" />
  </g>
</svg>
